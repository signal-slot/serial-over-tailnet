[package]
name = "serial-over-tailnet-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ESP32-S3 firmware: interactive setup shell, USB serial host (CDC-ACM/FTDI/CP210x/CH34x), Tailscale node and TCP serial bridge"
rust-version = "1.77"

[[bin]]
name = "serial-over-tailnet-firmware"
harness = false

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
opt-level = "z"
debug = true

[features]
default = []
# The adapter board in hardware/board (ESP32-S3-MINI-1-N4R2, two switchable
# USB-C ports) instead of the YD-ESP32-S3 development board.
board-adapter = []
# The Seeed Studio XIAO ESP32S3 (ESP32-S3R8, one USB-C port): no USB host;
# a 3.3 V UART on D10 (TX) and D9 (RX) is bridged instead, and the USB port
# stays the console. Build with variants/xiao-s3.defaults.
board-xiao-s3 = []
# The Seeed Studio XIAO ESP32C3 (ESP32-C3, 4 MB flash, no PSRAM), like the
# XIAO ESP32S3: no USB host, a 3.3 V UART is bridged. Build for the target
# riscv32imc-esp-espidf with MCU=esp32c3 and variants/xiao-c3.defaults.
board-xiao-c3 = ["tsnode/small-ram"]

[dependencies]
esp-idf-svc = { version = "0.53", features = ["std", "alloc", "binstart", "critical-section"] }
esp-idf-sys = "0.38"
esp-idf-hal = "0.47"
tsnode = { path = "../crates/tsnode" }
adapter-core = { path = "../crates/adapter-core" }
log = "0.4"
anyhow = "1"

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "workspace"
# Default module variant; CI overrides this with ESP_IDF_SDKCONFIG_DEFAULTS.
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults", "variants/n16r8.defaults"]
extra_components = [
  { remote_component = { name = "espressif/usb_host_cdc_acm", version = "2.4.1" }, bindings_header = "bindings.h", bindings_module = "usb" },
]
