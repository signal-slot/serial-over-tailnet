name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  ESP_TOOLCHAIN_VERSION: "1.97.0.0"
  ESPUP_VERSION: "v0.17.1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Module variants n<flash MB>r<PSRAM MB>: the ones the YD-ESP32-S3
        # board is made with. PSRAM is required; flash size and PSRAM mode
        # are build-time settings. `xiao-s3` and `xiao-c3` are the Seeed
        # Studio XIAO ESP32S3 and ESP32C3 (no USB host: a 3.3 V UART is
        # bridged); the ESP32-C3 is a RISC-V chip without PSRAM, built for
        # another target and without the USB host component. `adapter` is the
        # board in hardware/board; it is built here but not offered by the
        # installer until a board has been made and tested.
        variant: [n16r8, n8r8, n8r2, adapter, xiao-s3, xiao-c3]
        include:
          - variant: adapter
            features: --features board-adapter
          - variant: xiao-s3
            features: --features board-xiao-s3
          - variant: xiao-c3
            features: --features board-xiao-c3 --target riscv32imc-esp-espidf
            mcu: esp32c3
            no_extra_components: true
    env:
      ESP_IDF_SDKCONFIG_DEFAULTS: "sdkconfig.defaults;variants/${{ matrix.variant }}.defaults"
    steps:
      - uses: actions/checkout@v4

      - name: ESP-IDF prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Cache Rust esp toolchain and ldproxy
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/.cargo/bin/ldproxy
          key: esp-toolchain-${{ env.ESP_TOOLCHAIN_VERSION }}-${{ env.ESPUP_VERSION }}

      # espup installs the `esp` rustup toolchain (Xtensa-enabled rustc) and
      # its gcc. The export script it writes is deliberately NOT sourced:
      # esp-idf-sys downloads the gcc that matches the pinned ESP-IDF itself, and
      # a different Xtensa gcc first on PATH makes the link fail on libnosys.
      - name: Install esp toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl -L "https://github.com/esp-rs/espup/releases/download/${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu" -o /tmp/espup
          chmod +x /tmp/espup
          /tmp/espup install --targets esp32s3 --toolchain-version "$ESP_TOOLCHAIN_VERSION" --export-file /tmp/export-esp.sh
          cargo install ldproxy --locked

      - name: Cache ESP-IDF and build directory
        uses: actions/cache@v4
        with:
          path: |
            firmware/.embuild
            firmware/target
          # The ESP-IDF build directory records absolute paths, so the cache
          # is keyed on the repository name as well (a rename changes the path).
          key: firmware-${{ github.event.repository.name }}-${{ matrix.variant }}-${{ hashFiles('firmware/Cargo.lock', 'firmware/sdkconfig.defaults', 'firmware/variants/*', 'firmware/.cargo/config.toml', 'firmware/build.rs') }}
          restore-keys: firmware-${{ github.event.repository.name }}-${{ matrix.variant }}-

      - name: Build
        working-directory: firmware
        env:
          MCU: ${{ matrix.mcu || 'esp32s3' }}
        run: |
          if [ "${{ matrix.no_extra_components }}" = "true" ]; then
            export ESP_IDF_SYS_EXTRA_COMPONENTS_FILE="$PWD/variants/no-extra-components.toml"
          fi
          cargo build --release ${{ matrix.features }}

      - name: Flash image
        working-directory: firmware
        run: tools/mkimage.sh ${{ matrix.variant }} release dist/${{ matrix.variant }}

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: firmware/dist/${{ matrix.variant }}/*.bin

  site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
      - name: Web installer site
        run: |
          version=$(grep -m1 '^version' firmware/Cargo.toml | cut -d'"' -f2)
          mkdir -p site/firmware
          cp web/* site/
          rm site/manifest.json
          rm -rf dist/firmware-adapter   # untested board: not on the site or in releases yet
          for d in dist/firmware-*; do
            v=${d#dist/firmware-}
            mkdir -p "site/firmware/$v"
            cp "$d/bootloader.bin" "$d/partition-table.bin" "$d/app.bin" "site/firmware/$v/"
            # The chip, from the variant's ESP-IDF target (ESP32-S3 unless it says otherwise).
            chip=$(sed -n 's/^CONFIG_IDF_TARGET="esp32\(.*\)"/\1/p' "firmware/variants/$v.defaults" | tr a-z A-Z)
            sed "s/__VARIANT__/$v/g; s/__CHIP__/ESP32-${chip:-S3}/g" web/manifest.json > "site/manifest-$v.json"
          done
          sed -i "s/__VERSION__/${version}+${GITHUB_SHA::7}/" site/manifest-*.json site/index.html
          ls -R site | head -40
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/firmware-*/serial-over-tailnet-*.bin

  # Deploys the installer site. Off while the repository is private (GitHub Pages is
  # not available to it then): set the repository variable DEPLOY_PAGES to "true"
  # after making the repository public and enabling Pages.
  pages:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
