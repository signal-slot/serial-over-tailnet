[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
# Loads the ELF into a Pico 2 W in BOOTSEL mode and starts it.
runner = "picotool load -u -v -x -t elf"
# getrandom 0.4 (used by the TLS provider) takes its bytes from src/rng.rs.
rustflags = ['--cfg', 'getrandom_backend="custom"']
