function pickLanguage() {
  const fromQuery = new URLSearchParams(location.search).get('lang');
  let stored = null;
  try { stored = localStorage.getItem('lang'); } catch (e) {}
  const candidates = [fromQuery, stored, ...navigator.languages, 'en'];
  for (const c of candidates) {
    if (!c) continue;
    const base = c.toLowerCase().split('-')[0];
    if (STRINGS[base]) return base;
  }
  return 'en';
}

// The board the page is showing: 'yd' (YD-ESP32-S3, USB host) or 'xiao'
// (Seeed Studio XIAO ESP32S3, UART). A string with the key `<name>_xiao`
// replaces `<name>` for the XIAO.
let board = 'yd';
let language = 'en';

function applyLanguage(lang) {
  language = lang;
  const all = STRINGS[lang];
  const t = (key) => (board === 'xiao' && all[key + '_xiao']) || all[key];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.getElementById('lang').value = lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
}

applyLanguage(pickLanguage());
document.getElementById('lang').addEventListener('change', (ev) => applyLanguage(ev.target.value));

const variantSelect = document.getElementById('variant');
const boardSelect = document.getElementById('board');
function applyManifest() {
  const v = board === 'xiao' ? 'xiao-s3' : variantSelect.value;
  document.getElementById('install').setAttribute('manifest', `manifest-${v}.json`);
}
function applyVariant(v) {
  variantSelect.value = v;
  try { localStorage.setItem('variant', v); } catch (e) {}
  applyManifest();
}
function applyBoard(b) {
  board = b;
  boardSelect.value = b;
  document.documentElement.classList.toggle('board-xiao', b === 'xiao');
  try { localStorage.setItem('board', b); } catch (e) {}
  applyLanguage(language);
  applyManifest();
}
{
  let v = new URLSearchParams(location.search).get('variant');
  try { v = v || localStorage.getItem('variant'); } catch (e) {}
  applyVariant([...variantSelect.options].some((o) => o.value === v) ? v : 'n16r8');
}
variantSelect.addEventListener('change', (ev) => applyVariant(ev.target.value));
{
  let b = new URLSearchParams(location.search).get('board');
  try { b = b || localStorage.getItem('board'); } catch (e) {}
  applyBoard(b === 'xiao' ? 'xiao' : 'yd');
}
boardSelect.addEventListener('change', (ev) => applyBoard(ev.target.value));

if (!('serial' in navigator)) document.documentElement.classList.add('no-serial');

const term = document.getElementById('term');
const btnConnect = document.getElementById('connect');
const btnDisconnect = document.getElementById('disconnect');
let port, reader, writer, closing = false;

function append(text) {
  for (const ch of text) {
    if (ch === '\b') term.textContent = term.textContent.slice(0, -1);
    else if (ch !== '\r') term.textContent += ch;
  }
  term.scrollTop = term.scrollHeight;
}

async function readLoop() {
  const decoder = new TextDecoder();
  while (port && port.readable && !closing) {
    reader = port.readable.getReader();
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        append(decoder.decode(value, { stream: true }));
      }
    } catch (e) {
      append(`\n[read error: ${e.message}]\n`);
    } finally {
      reader.releaseLock();
      reader = null;
    }
  }
}

async function connect() {
  try {
    // The shell runs on both the native USB Serial/JTAG port (Espressif,
    // 303a) and UART0, which the CH343 on the COM port of these boards
    // (1a86:55d3) exposes. The flashing dialog accepts either, so offer
    // both here too; a board flashed over COM is set up over COM.
    port = await navigator.serial.requestPort({ filters: [
      { usbVendorId: 0x303a },
      { usbVendorId: 0x1a86, usbProductId: 0x55d3 },
    ] });
    await port.open({ baudRate: 115200 });
    // Both lines asserted is the "no reset" state of the USB Serial/JTAG
    // auto-reset logic and of the DTR/RTS auto-download circuit behind
    // the COM port; anything else may drop the chip into download mode.
    await port.setSignals({ dataTerminalReady: true, requestToSend: true });
    writer = port.writable.getWriter();
    closing = false;
    term.textContent = '';
    term.classList.remove('disconnected');
    btnConnect.disabled = true;
    btnDisconnect.disabled = false;
    term.focus();
    readLoop();
  } catch (e) {
    append(`[connect failed: ${e.message}]\n`);
  }
}

async function disconnect() {
  closing = true;
  try { if (reader) await reader.cancel(); } catch (e) {}
  try { if (writer) { writer.releaseLock(); writer = null; } } catch (e) {}
  try { if (port) await port.close(); } catch (e) {}
  port = null;
  term.classList.add('disconnected');
  btnConnect.disabled = false;
  btnDisconnect.disabled = true;
}

async function send(text) {
  if (writer) await writer.write(new TextEncoder().encode(text));
}

term.addEventListener('keydown', (ev) => {
  if (!writer) return;
  let out = null;
  if (ev.key === 'Enter') out = '\r';
  else if (ev.key === 'Backspace') out = '\x7f';
  else if (ev.ctrlKey && ev.key.toLowerCase() === 'c') out = '\x03';
  else if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey) out = ev.key;
  if (out !== null) {
    ev.preventDefault();
    send(out);
  }
});
term.addEventListener('paste', (ev) => {
  ev.preventDefault();
  send(ev.clipboardData.getData('text').replace(/\r?\n/g, '\r'));
});

btnConnect.addEventListener('click', connect);
btnDisconnect.addEventListener('click', disconnect);
if ('serial' in navigator) navigator.serial.addEventListener('disconnect', (ev) => { if (ev.target === port) disconnect(); });
</script>
